name: Daily News Digest

on:
  schedule:
    # 8:17 AM in Sydney every day. Cron uses UTC unless a timezone is set,
    # and with one set GitHub keeps the local time across daylight saving.
    # The 17 is on purpose. GitHub delays scheduled runs most at the start of
    # an hour, and "0 8 * * *" started every run 110 to 208 minutes late. See
    # HOW-IT-WORKS.md, "When the email arrives".
    - cron: "17 8 * * *"
      timezone: "Australia/Sydney"
  workflow_dispatch: {}   # manual run from the Actions tab

jobs:
  send-digest:
    runs-on: ubuntu-latest
    # A worst-case run takes about 30 minutes: every feed timing out, the
    # full 15-minute model budget (TOTAL_BUDGET), then sending. On top of that
    # a run can wait up to 3 hours for deliver_at (MAX_HOLD in
    # digestlib/schedule.py), so the limit is 35 + 180 minutes. It still stops a stuck run well before
    # GitHub's default of 6 hours.
    timeout-minutes: 215
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional non-Google fallback. The chain skips it when unset.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          # Chat channels. Each is used only when the channels list in
          # topics.json names it.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # The cron entry that started a scheduled run, empty for a manual
          # one. The script works out from it when the run was due, to log
          # how late it started and to know when to send.
          DIGEST_SCHEDULE: ${{ github.event.schedule }}
          # Only needed if the schedule's own timezone differs from the one in
          # topics.json, such as a UTC cron entry with no timezone key.
          # DIGEST_SCHEDULE_TZ: "UTC"
        run: python digest.py

      # The script saves what it sent to saved-digests/ once the email has
      # gone. The weekly edition is written from these files. Anyone signed in
      # to GitHub can download an artifact from a public repo, so the file holds
      # only what was in the email.
      - name: Keep this digest for the weekly edition
        uses: actions/upload-artifact@v7
        with:
          name: daily-digest
          path: saved-digests/
          retention-days: 14
          if-no-files-found: warn
