name: Daily News Digest

on:
  schedule:
    # 8:00 AM Australia/Sydney every day. GitHub Actions cron runs in UTC
    # by default. The timezone field below is an IANA zone, so GitHub keeps
    # the wall-clock time at 8 AM through the AEST/AEDT switch on its own.
    # Running exactly on the hour would normally risk load spikes, but this
    # workflow is short and low traffic, so :00 is fine here.
    - cron: "0 8 * * *"
      timezone: "Australia/Sydney"
  workflow_dispatch: {}   # manual run from the Actions tab

jobs:
  send-digest:
    runs-on: ubuntu-latest
    # Upper bound on a run. Feeds are fetched in parallel with a per-host
    # timeout, which holds the worst case for all 75 of them to about four
    # minutes, and all summarization shares one wall-clock budget
    # (TOTAL_BUDGET, 8 minutes) that no combination of retries can exceed.
    # 25 minutes gives both room to breathe while still being a backstop
    # against the default 360-minute job cap, so a stuck run can't quietly
    # eat the whole day and skip the email.
    timeout-minutes: 25
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional non-Google fallback. The chain skips it when unset.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python digest.py
