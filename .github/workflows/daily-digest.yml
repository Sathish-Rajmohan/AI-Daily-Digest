name: Daily News Digest

on:
  schedule:
    # 8:00 AM in Sydney every day. Cron uses UTC unless a timezone is set,
    # and with one set GitHub keeps the local time across daylight saving.
    - cron: "0 8 * * *"
      timezone: "Australia/Sydney"
  workflow_dispatch: {}   # manual run from the Actions tab

jobs:
  send-digest:
    runs-on: ubuntu-latest
    # A worst-case run takes about 30 minutes: every feed timing out, the
    # full 15-minute model budget (TOTAL_BUDGET), then sending. This limit
    # stops a stuck run long before GitHub's default of 6 hours.
    timeout-minutes: 35
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional non-Google fallback. The chain skips it when unset.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python digest.py
