name: Daily News Digest

on:
  schedule:
    # 8:00 AM Australia/Sydney every day. GitHub Actions cron runs in UTC
    # by default. The timezone field below is an IANA zone, so GitHub keeps
    # the wall-clock time at 8 AM through the AEST/AEDT switch on its own.
    # Running exactly on the hour would normally risk load spikes, but this
    # workflow is short and low traffic, so :00 is fine here.
    - cron: "0 8 * * *"
      timezone: "Australia/Sydney"
  workflow_dispatch: {}   # manual run from the Actions tab

jobs:
  send-digest:
    runs-on: ubuntu-latest
    # Upper bound on a run. fetch_feed() in digest.py already bounds a
    # single unresponsive feed host. This is a backstop against the default
    # 360-minute job cap, so a stuck run can't quietly eat the whole day
    # and skip the email.
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python digest.py
